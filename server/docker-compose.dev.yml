services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: xingxuan
      POSTGRES_USER: xingxuan
      POSTGRES_PASSWORD: xingxuan_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - xingxuan_dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xingxuan -d xingxuan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  xingxuan_dev_postgres:
